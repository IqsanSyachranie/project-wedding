<div class="editor-container">
  <h2 class="editor-heading">Story Items</h2>

  @if (isLoading()) {
    <div class="editor-loading">Loading...</div>
  } @else {
    @if (error()) {
      <div class="editor-error">{{ error() }}</div>
    }
    @if (successMessage()) {
      <div class="editor-success">{{ successMessage() }}</div>
    }

    <div class="editor-actions">
      <button (click)="startNew()">Add New Item</button>
    </div>

    @if (editingItem) {
      <form (ngSubmit)="onSave()" class="editor-form">
        <label>
          Title
          <input type="text" [(ngModel)]="editingItem.title" name="title" required />
        </label>
        <label>
          Body
          <textarea [(ngModel)]="editingItem.body" name="body" rows="5" required></textarea>
        </label>
        <label>
          Image URL
          <input type="text" [(ngModel)]="editingItem.imageUrl" name="imageUrl" />
        </label>
        <label>
          Sort Order
          <input type="number" [(ngModel)]="editingItem.sortOrder" name="sortOrder" />
        </label>
        <div class="editor-actions">
          <button type="submit" [disabled]="isSaving()">
            {{ isSaving() ? 'Saving...' : (editingItem.id ? 'Update' : 'Create') }}
          </button>
          <button type="button" (click)="cancelEdit()">Cancel</button>
        </div>
      </form>
    }

    <table class="editor-table">
      <thead>
        <tr>
          <th>Order</th>
          <th>Title</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody>
        @for (item of items; track item.id) {
          <tr>
            <td>{{ item.sortOrder }}</td>
            <td>{{ item.title }}</td>
            <td>
              <button (click)="startEdit(item)">Edit</button>
              <button (click)="onDelete(item)">Delete</button>
            </td>
          </tr>
        }
      </tbody>
    </table>
  }
</div>
