<section class="gallery" [class.gallery--revealed]="revealed()" aria-label="Galeri foto pernikahan">
  <div class="gallery__inner">
    <div class="gallery__ornament" aria-hidden="true">&#10070; &#10070; &#10070;</div>
    <h2 class="gallery__heading">Galeri Foto</h2>

    <div class="gallery__grid">
      @for (_ of frames; track $index) {
        <div
          class="gallery__frame"
          aria-hidden="true"
        >
          <div class="gallery__placeholder"></div>
        </div>
      }
    </div>

    <div class="gallery__ornament" aria-hidden="true">&#10070; &#10070; &#10070;</div>
  </div>
</section>
