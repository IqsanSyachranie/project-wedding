<section
  class="hero"
  [class.hero--revealed]="revealed()"
  aria-label="Pembukaan undangan pernikahan"
>
  <div class="hero__inner">
    <div class="hero__ornament hero__ornament--top" aria-hidden="true">&#10070; &#10070; &#10070;</div>

    <h1 class="hero__names">{{ coupleNames }}</h1>

    <div class="hero__ornament hero__ornament--middle" aria-hidden="true">&#8212; &#10038;&#10038;&#10038; &#8212;</div>

    <p class="hero__opening">{{ openingLine }}</p>

    <time class="hero__date" datetime="2026-10-17">{{ weddingDate }}</time>

    <div class="hero__ornament hero__ornament--bottom" aria-hidden="true">&#10070; &#10070; &#10070;</div>
  </div>

  <div
    class="hero__scroll-hint"
    [class.hero__scroll-hint--hidden]="scrolled()"
    aria-hidden="true"
  >
    <span class="hero__scroll-icon animate-float" aria-hidden="true">&#8595;</span>
    <span class="hero__scroll-label">Geser ke bawah untuk melanjutkan</span>
  </div>
</section>
