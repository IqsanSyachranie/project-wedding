@if (!showContent()) {
  <app-preloader />
}

@if (showLockedLanding()) {
  <app-locked-landing
    [coupleNames]="dataService.config()?.heroCoupleNames ?? ''"
    [greeting]="dataService.config()?.lockedLandingGreeting ?? ''"
    [buttonText]="dataService.config()?.lockedLandingButtonText ?? 'Buka Undangan'"
    [backgroundImage]="dataService.config()?.heroBackgroundImage ?? null"
    [weddingDate]="dataService.config()?.weddingDate ?? null"
    [groomPhotoUrl]="dataService.coupleInfo()?.groomPhotoUrl ?? null"
    [bridePhotoUrl]="dataService.coupleInfo()?.bridePhotoUrl ?? null"
    [groomName]="dataService.coupleInfo()?.groomName ?? null"
    [brideName]="dataService.coupleInfo()?.brideName ?? null"
    (unlocked)="onLandingUnlocked()"
  />
}
