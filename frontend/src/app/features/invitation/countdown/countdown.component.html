<section
  class="countdown"
  [class.countdown--revealed]="revealed()"
  aria-label="Hitung mundur menuju hari pernikahan"
>
  @if (timeRemaining().isPast) {
    <div class="countdown__past">
      <div class="countdown__divider" aria-hidden="true">
        <span class="countdown__divider-diamond"></span>
      </div>
      <p class="countdown__past-text">Acara telah dimulai</p>
      <p class="countdown__past-subtext">Terima kasih atas doa dan kehadiran Anda</p>
    </div>
  } @else {
    <div class="countdown__inner">
      <div class="countdown__divider" aria-hidden="true">
        <span class="countdown__divider-diamond"></span>
      </div>
      <h2 class="countdown__heading">Menuju Hari Bahagia</h2>
      <div class="countdown__underline" aria-hidden="true"></div>

      <div class="countdown__blocks">
        <div class="countdown__block">
          <span class="countdown__number">{{ timeRemaining().days }}</span>
          <span class="countdown__label">Hari</span>
        </div>
        <div class="countdown__block">
          <span class="countdown__number">{{ timeRemaining().hours }}</span>
          <span class="countdown__label">Jam</span>
        </div>
        <div class="countdown__block">
          <span class="countdown__number">{{ timeRemaining().minutes }}</span>
          <span class="countdown__label">Menit</span>
        </div>
        <div class="countdown__block">
          <span class="countdown__number">{{ timeRemaining().seconds ?? '00' }}</span>
          <span class="countdown__label">Detik</span>
        </div>
      </div>
    </div>
  }
</section>
