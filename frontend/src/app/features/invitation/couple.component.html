<section
  class="couple"
  [class.couple--revealed]="revealed()"
  aria-label="Mempelai"
>
  <div class="couple__inner">
    <div class="couple__ornament" aria-hidden="true">&#10070; &#10070; &#10070;</div>
    <h2 class="couple__heading">Mempelai</h2>
    <div class="couple__photo-frame" aria-hidden="true">
      <span class="couple__photo-placeholder">Foto Mempelai</span>
    </div>
    <p class="couple__names">Arif Prayoga &amp; Sari Dewi</p>
    <p class="couple__parents">
      Putra dari Bapak Ahmad &amp; Ibu Fatimah<br>
      Putri dari Bapak Budi &amp; Ibu Sri
    </p>
    <p class="couple__greeting">
      Merupakan suatu kehormatan dan kebahagiaan bagi kami sekeluarga<br>
      apabila Bapak/Ibu/Saudara/i berkenan hadir memberikan doa restu
    </p>
    <div class="couple__ornament" aria-hidden="true">&#10070; &#10070; &#10070;</div>
  </div>
</section>
