<section class="philosophy" [class.philosophy--revealed]="revealed()" aria-label="Filosofi dan doa pernikahan">
  <div class="philosophy__inner">
    <div class="philosophy__ornament" aria-hidden="true">&#10070; &#10070; &#10070;</div>
    <h2 class="philosophy__heading">Filosofi &amp; Doa</h2>

    <blockquote class="philosophy__quote">
      <div class="philosophy__ornament-inline" aria-hidden="true">&#8220;</div>
      <p class="philosophy__quote-text">
        Mikul dhuwur mendhem jero<br>
        Artinya menjunjung tinggi kebaikan dan<br>
        memendam keburukan demi keharmonisan
      </p>
      <div class="philosophy__ornament-inline" aria-hidden="true">&#8221;</div>
    </blockquote>

    <p class="philosophy__prayer">
      Semoga Allah SWT meridhoi pernikahan ini,<br>
      menjadikannya langgeng, penuh berkah,<br>
      dan menjadi keluarga yang sakinah, mawaddah, wa rahmah.
    </p>

    <div class="philosophy__ornament" aria-hidden="true">&#10070; &#10070; &#10070;</div>
  </div>
</section>
